services:
  - type: web
    name: tchatchi-ai
    # On dit à Render d'utiliser Docker, pas son environnement Python natif.
    env: docker
    plan: free
    region: frankfurt

    # Variables d'environnement : toutes en "sync: false" pour ne jamais
    # écrire de valeur secrète dans ce fichier (qui est sur GitHub, public
    # ou non). Render te demandera la valeur de chacune une seule fois,
    # au moment de la synchronisation, puis les gardera en mémoire.
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: APP_SECRET_KEY
        sync: false
      - key: CAMPAY_APP_USERNAME
        sync: false
      - key: CAMPAY_APP_PASSWORD
        sync: false
      - key: CAMPAY_PERMANENT_TOKEN
        sync: false
      - key: CAMPAY_ENV
        value: demo
      - key: MONETBIL_SERVICE_KEY
        sync: false
      - key: MONETBIL_SERVICE_SECRET
        sync: false